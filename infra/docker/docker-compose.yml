# Author: MilanWoj
name: loculus

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: loculus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - loculus-qdrant-data:/qdrant/storage

  searxng:
    image: searxng/searxng:latest
    container_name: loculus-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["prod"]
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: loculus-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://host.docker.internal:8080/v1
      - EMBEDDINGS_BASE_URL=http://host.docker.internal:8081/v1
      - QDRANT_HOST=qdrant
      - QDRANT_GRPC_PORT=6334
      - SEARXNG_BASE_URL=http://searxng:8080
      - HOST_METRICS_PATH=/app/infra/run/host-metrics.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../run:/app/infra/run:ro
      - ../../documents:/app/documents:ro
    depends_on:
      - qdrant
      - searxng

volumes:
  loculus-qdrant-data:
  searxng_cache:
